      - {service: retrieval-service, store_location: retrieval-service-postgresql, kms_alias: kms/db/retrieval-service, data_owner: retrieval-service, workload_principal: retrieval-service-db-workload}
      - {service: provider-service, store_location: provider-service-postgresql, kms_alias: kms/db/provider-service, data_owner: provider-service, workload_principal: provider-service-db-workload}
      - {service: citation-service, store_location: citation-service-postgresql, kms_alias: kms/db/citation-service, data_owner: citation-service, workload_principal: citation-service-db-workload}
      - {service: chat-service, store_location: chat-service-postgresql, kms_alias: kms/db/chat-service, data_owner: chat-service, workload_principal: chat-service-db-workload}
      - {service: feedback-service, store_location: feedback-service-postgresql, kms_alias: kms/db/feedback-service, data_owner: feedback-service, workload_principal: feedback-service-db-workload}
      - {service: evaluation-service, store_location: evaluation-service-postgresql, kms_alias: kms/db/evaluation-service, data_owner: evaluation-service, workload_principal: evaluation-service-db-workload}
