openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info: {title: UEB Internal Index API v1, version: 1.0.0}
servers: [{url: /, description: Deployment base is injected; no domain is asserted by this contract.}]
x-ueb-audience: INTERNAL
paths:
  /internal/v1/searches:
    post:
      operationId: searchIndex
      tags: [index-internal]
      description: index-service performs its fixed search behavior after scope and resource authorization. No arbitrary DSL, filter, sort, or canonical metadata is accepted or returned.
      security: [{BearerAuth: []}]
      x-ueb-required-scopes: [index.search]
      x-ueb-owner-service: index-service
      x-ueb-data-access: OWNER_SERVICE_ONLY
      x-ueb-request-max-bytes: 8192
      x-ueb-timeout-ms: 2000
      parameters: [{$ref: components-v1.yaml#/components/parameters/X-Request-Deadline-At}, {$ref: components-v1.yaml#/components/parameters/Idempotency-Key}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: components-v1.yaml#/components/schemas/IndexSearchRequest}}}}
      responses: {'200': {description: Context identifier and evidence references only, headers: {Cache-Control: {schema: {const: no-store}}, X-Request-Id: {$ref: components-v1.yaml#/components/headers/X-Request-Id}}, content: {application/json: {schema: {$ref: components-v1.yaml#/components/schemas/IndexSearchResult}}}}, '400': {$ref: '#/components/responses/Problem'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '413': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/ProblemRetry'}, '500': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/ProblemRetry'}, '504': {$ref: '#/components/responses/Problem'}}
  /internal/v1/retrieval-contexts:validate:
    post:
      operationId: validateIndexRetrievalContext
      tags: [index-internal]
      description: index-service validates a request-bound context and at most 100 chunk identifiers after scope and resource authorization; stale, foreign, or injected references are rejected by service invariant and it never extends a supplied deadline.
      security: [{BearerAuth: []}]
      x-ueb-required-scopes: [index.context:validate]
      x-ueb-owner-service: index-service
      x-ueb-data-access: OWNER_SERVICE_ONLY
      x-ueb-request-max-bytes: 16384
      x-ueb-timeout-ms: 1000
      parameters: [{$ref: components-v1.yaml#/components/parameters/X-Request-Deadline-At}, {$ref: components-v1.yaml#/components/parameters/Idempotency-Key}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: components-v1.yaml#/components/schemas/ContextValidationRequest}}}}
      responses: {'200': {description: Validity and bounded reason codes, headers: {Cache-Control: {schema: {const: no-store}}, X-Request-Id: {$ref: components-v1.yaml#/components/headers/X-Request-Id}}, content: {application/json: {schema: {$ref: components-v1.yaml#/components/schemas/ContextValidationResult}}}}, '400': {$ref: '#/components/responses/Problem'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '413': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/ProblemRetry'}, '500': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/ProblemRetry'}, '504': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes: {BearerAuth: {$ref: components-v1.yaml#/components/securitySchemes/BearerAuth}}
  responses:
    Problem: {description: Safe problem, headers: {Cache-Control: {schema: {const: no-store}}, X-Request-Id: {$ref: components-v1.yaml#/components/headers/X-Request-Id}}, content: {application/problem+json: {schema: {$ref: components-v1.yaml#/components/schemas/Problem}}}}
    ProblemRetry: {description: Safe transient problem, headers: {Cache-Control: {schema: {const: no-store}}, X-Request-Id: {$ref: components-v1.yaml#/components/headers/X-Request-Id}, Retry-After: {$ref: components-v1.yaml#/components/headers/Retry-After}}, content: {application/problem+json: {schema: {$ref: components-v1.yaml#/components/schemas/Problem}}}}
