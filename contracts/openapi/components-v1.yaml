openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: UEB HTTP API v1 shared components
  version: 1.0.0
paths: {}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer token validation is deployment and owner-service controlled; no client role header is trusted.
  headers:
    X-Request-Id:
      description: Optional opaque correlation identifier supplied by the caller or generated by the service.
      schema: {type: string, minLength: 1, maxLength: 128}
    Retry-After:
      description: Present only on documented transient 429 or 503 responses.
      schema: {type: integer, minimum: 1}
    Idempotency-Replayed:
      description: true when a completed request is replayed under the project idempotency convention.
      schema: {type: boolean}
    Location:
      description: API route for the accepted processing job, never an object or storage location.
      schema: {type: string, pattern: '^/v1/admin/processing-jobs/[A-Za-z0-9._~-]+$'}
  parameters:
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: Project convention, not an RFC. Scope is principal or session plus operationId plus key; TTL is 24 hours and a canonical request fingerprint is bound. A completed equal request replays, an in-flight request is 409, a changed fingerprint is 422, and missing or invalid is 400. Retry an ambiguous timeout only with the same key.
      schema: {type: string, pattern: '^[\x21-\x7E]{8,128}$'}
    If-Match:
      name: If-Match
      in: header
      required: true
      description: Required optimistic lifecycle revision token.
      schema: {type: string, minLength: 1, maxLength: 256}
    X-Request-Deadline-At:
      name: X-Request-Deadline-At
      in: header
      required: true
      description: Absolute caller deadline. A malformed or expired deadline is 400 and no service extends it.
      schema: {type: string, format: date-time}
    Cursor:
      name: cursor
      in: query
      description: Opaque continuation cursor for the endpoint's fixed stable sort.
      schema: {type: string, maxLength: 256}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    AuditLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  schemas:
    OpaqueId: {type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$'}
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457 problem details. detail is safe and never contains a stack trace, SQL, raw payload, internal identifier, or secret.
      properties:
        type: {type: string, format: uri, pattern: '^https?://'}
        title: {type: string, minLength: 1, maxLength: 128}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 1024}
        instance: {type: string, minLength: 1, maxLength: 256}
        code: {type: string, minLength: 1, maxLength: 64}
        correlation_id: {$ref: '#/components/schemas/OpaqueId'}
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              pointer: {type: string, pattern: '^(/([^/~]|~[01])*)?$'}
              detail: {type: string, minLength: 1, maxLength: 512}
            required: [pointer, detail]
      required: [type, title, status, code, correlation_id]
    Locator:
      type: object
      additionalProperties: false
      properties:
        page: {type: integer, minimum: 1}
        article: {type: string, minLength: 1, maxLength: 64}
        clause: {type: string, minLength: 1, maxLength: 64}
        point: {type: string, minLength: 1, maxLength: 64}
        character_start: {type: integer, minimum: 0}
        character_end: {type: integer, minimum: 0}
      anyOf:
        - required: [page]
        - required: [article]
        - required: [clause]
        - required: [point]
        - required: [character_start]
        - required: [character_end]
    QuestionRequest:
      type: object
      additionalProperties: false
      properties:
        question: {type: string, minLength: 1, maxLength: 4000}
        conversation_id: {$ref: '#/components/schemas/OpaqueId'}
        locale: {const: vi-VN}
      required: [question, locale]
    PublicClaim:
      type: object
      additionalProperties: false
      properties:
        claim_ref: {type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$', description: Ephemeral API presentation reference, not a service or persistence ID.}
        text: {type: string, minLength: 1, maxLength: 4000}
        citation_refs:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/OpaqueId'}
      required: [claim_ref, text, citation_refs]
    PublicCitation:
      type: object
      additionalProperties: false
      properties:
        citation_ref: {type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$', description: Ephemeral API presentation reference, not a service or persistence ID.}
        claim_ref: {type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$', description: Ephemeral API presentation reference, not a service or persistence ID.}
        official_title: {type: string, minLength: 1, maxLength: 512}
        document_number: {type: string, minLength: 1, maxLength: 128}
        canonical_url: {type: string, format: uri}
        locator: {$ref: '#/components/schemas/Locator'}
        excerpt: {type: string, minLength: 1, maxLength: 4000}
      required: [citation_ref, claim_ref, official_title, document_number, canonical_url, locator, excerpt]
    QuestionResult:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            response_ref: {type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$', description: Ephemeral API presentation reference, not a service or persistence ID.}
            outcome: {const: ANSWER}
            claims: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PublicClaim'}}
            citations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PublicCitation'}}
          required: [response_ref, outcome, claims, citations]
        - type: object
          additionalProperties: false
          properties:
            response_ref: {type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$', description: Ephemeral API presentation reference, not a service or persistence ID.}
            outcome: {const: REFUSAL}
            refusal: {$ref: '../schemas/common.schema.json#/$defs/Refusal'}
          required: [response_ref, outcome, refusal]
    AcceptedIngestion:
      type: object
      additionalProperties: false
      properties:
        document_id: {$ref: '#/components/schemas/OpaqueId'}
        version_id: {$ref: '#/components/schemas/OpaqueId'}
        job_id: {$ref: '#/components/schemas/OpaqueId'}
        status: {const: QUEUED}
      required: [document_id, version_id, job_id, status]
    DocumentView:
      type: object
      additionalProperties: false
      properties:
        document_id: {$ref: '#/components/schemas/OpaqueId'}
        status: {type: string, enum: [DRAFT, PUBLISHED, UNPUBLISHED, ARCHIVED]}
        active: {type: boolean}
        current_version_id: {$ref: '#/components/schemas/OpaqueId'}
        official_title: {type: string, minLength: 1, maxLength: 512}
        document_number: {type: string, minLength: 1, maxLength: 128}
        revision: {type: integer, minimum: 1}
        changed_at: {type: string, format: date-time}
      required: [document_id, status, active, official_title, document_number, revision, changed_at]
    DocumentVersionView:
      type: object
      additionalProperties: false
      properties:
        version_id: {$ref: '#/components/schemas/OpaqueId'}
        document_id: {$ref: '#/components/schemas/OpaqueId'}
        status: {type: string, enum: [INGESTED, PROCESSING, READY_FOR_REVIEW, APPROVED, REJECTED, FAILED]}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
      required: [version_id, document_id, status, revision, created_at]
    DocumentPage:
      type: object
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DocumentView'}}
        next_cursor: {type: [string, 'null'], maxLength: 256}
        has_more: {type: boolean}
      required: [items, next_cursor, has_more]
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision: {type: string, enum: [APPROVE, REJECT]}
        reason_code: {type: string, minLength: 1, maxLength: 64}
      required: [decision, reason_code]
    PublishRequest:
      type: object
      additionalProperties: false
      properties: {version_id: {$ref: '#/components/schemas/OpaqueId'}}
      required: [version_id]
    ReasonCodeRequest:
      type: object
      additionalProperties: false
      properties: {reason_code: {type: string, minLength: 1, maxLength: 64}}
      required: [reason_code]
    JobView:
      type: object
      additionalProperties: false
      properties:
        job_id: {$ref: '#/components/schemas/OpaqueId'}
        version_id: {$ref: '#/components/schemas/OpaqueId'}
        status: {type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        failure_code: {type: string, maxLength: 64}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
      required: [job_id, version_id, status, created_at]
    AuditRecordView:
      type: object
      additionalProperties: false
      properties:
        audit_id: {$ref: '#/components/schemas/OpaqueId'}
        actor_id: {$ref: '#/components/schemas/OpaqueId'}
        action_code: {type: string, minLength: 1, maxLength: 64}
        service_code: {type: string, minLength: 1, maxLength: 64}
        occurred_at: {type: string, format: date-time}
      required: [audit_id, actor_id, action_code, service_code, occurred_at]
    AuditRecordPage:
      type: object
      additionalProperties: false
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditRecordView'}}
        next_cursor: {type: [string, 'null'], maxLength: 256}
        has_more: {type: boolean}
      required: [items, next_cursor, has_more]
    IdBatch:
      type: object
      additionalProperties: false
      properties:
        ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueId'}}
      required: [ids]
    EligibilityResult:
      type: object
      additionalProperties: false
      properties:
        version_id: {$ref: '#/components/schemas/OpaqueId'}
        eligible: {type: boolean}
        reason_codes: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, maxLength: 64}}
      required: [version_id, eligible]
    EligibilityBatchResult:
      type: object
      additionalProperties: false
      properties:
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/EligibilityResult'}}
      required: [items]
    DocumentVersionMetadataView:
      type: object
      additionalProperties: false
      properties:
        version_id: {$ref: '#/components/schemas/OpaqueId'}
        document_id: {$ref: '#/components/schemas/OpaqueId'}
        status: {type: string, maxLength: 64}
        content_hash: {type: string, minLength: 1, maxLength: 256}
      required: [version_id, document_id, status, content_hash]
    CanonicalMetadataBinding:
      type: object
      additionalProperties: false
      properties: {version_id: {$ref: '#/components/schemas/OpaqueId'}}
      required: [version_id]
    CanonicalMetadataBatch:
      type: object
      additionalProperties: false
      properties: {bindings: {type: array, minItems: 1, maxItems: 50, items: {$ref: '#/components/schemas/CanonicalMetadataBinding'}}}
      required: [bindings]
    CanonicalMetadataResult:
      type: object
      additionalProperties: false
      properties:
        version_id: {$ref: '#/components/schemas/OpaqueId'}
        official_title: {type: string, minLength: 1, maxLength: 512}
        document_number: {type: string, minLength: 1, maxLength: 128}
        canonical_url: {type: string, format: uri}
      required: [version_id, official_title, document_number, canonical_url]
    CanonicalMetadataBatchResult:
      type: object
      additionalProperties: false
      properties: {items: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/CanonicalMetadataResult'}}}
      required: [items]
    ChunkBatchRequest:
      allOf: [{$ref: '#/components/schemas/IdBatch'}]
    Chunk:
      $ref: '../schemas/processing.schema.json#/$defs/Chunk'
    ChunkBatchResult:
      type: object
      additionalProperties: false
      properties: {items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Chunk'}}}
      required: [items]
    IndexSearchRequest:
      type: object
      additionalProperties: false
      properties:
        query: {type: string, minLength: 1, maxLength: 4000}
        max_results: {type: integer, minimum: 1, maximum: 50}
        request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
      required: [query, max_results, request_binding_id]
    EvidenceRef:
      type: object
      additionalProperties: false
      properties:
        evidence_id: {$ref: '#/components/schemas/OpaqueId'}
        chunk_id: {$ref: '#/components/schemas/OpaqueId'}
        version_id: {$ref: '#/components/schemas/OpaqueId'}
        rank: {type: integer, minimum: 1}
      required: [evidence_id, chunk_id, version_id, rank]
    IndexSearchResult:
      type: object
      additionalProperties: false
      properties:
        context_id: {$ref: '#/components/schemas/OpaqueId'}
        request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
        evidence: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/EvidenceRef'}}
      required: [request_binding_id, context_id, evidence]
    ContextValidationRequest:
      type: object
      additionalProperties: false
      properties:
        context_id: {$ref: '#/components/schemas/OpaqueId'}
        chunk_ids: {type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueId'}}
        request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
      required: [request_binding_id, context_id, chunk_ids]
    ContextValidationResult:
      type: object
      additionalProperties: false
      properties:
        valid: {type: boolean}
        request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
        reason_codes: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, maxLength: 64}}
      required: [request_binding_id, valid]
    RetrievalRequest:
      type: object
      additionalProperties: false
      properties:
        question: {type: string, minLength: 1, maxLength: 4000}
        request_context_id: {$ref: '#/components/schemas/OpaqueId'}
        request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
      required: [question, request_context_id, request_binding_id]
    RetrievalRunResult:
      type: object
      additionalProperties: false
      properties:
        request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
        run: {$ref: '../schemas/retrieval.schema.json#/$defs/RetrievalRun'}
      required: [request_binding_id, run]
    CitationValidationRequest:
      type: object
      additionalProperties: false
      properties:
        context_id: {$ref: '#/components/schemas/OpaqueId'}
        request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
        grounded_answer:
          allOf:
            - {$ref: '../schemas/chat.schema.json#/$defs/GroundedAnswer'}
            - properties:
                claims:
                  maxItems: 50
                  items:
                    properties:
                      chunk_ids: {maxItems: 100}
      required: [request_binding_id, context_id, grounded_answer]
    CitationValidationResult:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            outcome: {const: VALID}
            request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
            citations:
              type: array
              minItems: 1
              maxItems: 100
              items:
                allOf:
                  - {$ref: '../schemas/citation.schema.json#/$defs/Citation'}
                  - {properties: {validation_status: {const: VALID}}}
          required: [outcome, request_binding_id, citations]
        - type: object
          additionalProperties: false
          properties:
            outcome: {const: REFUSAL}
            request_binding_id: {$ref: '#/components/schemas/OpaqueId'}
            refusal: {$ref: '../schemas/common.schema.json#/$defs/Refusal'}
          required: [outcome, request_binding_id, refusal]
