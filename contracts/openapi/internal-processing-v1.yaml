openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info: {title: UEB Internal Processing API v1, version: 1.0.0}
servers: [{url: /, description: Deployment base is injected; no domain is asserted by this contract.}]
x-ueb-audience: INTERNAL
paths:
  /internal/v1/chunks:batch-get:
    post:
      operationId: getProcessingChunksBatch
      tags: [processing-internal]
      description: processing-service owns each authorized chunk and returns at most 100 chunks; content is explicitly untrusted source data.
      security: [{BearerAuth: []}]
      x-ueb-required-scopes: [processing.chunks:read]
      x-ueb-owner-service: processing-service
      x-ueb-data-access: OWNER_SERVICE_ONLY
      x-ueb-request-max-bytes: 16384
      x-ueb-timeout-ms: 2000
      parameters: [{$ref: components-v1.yaml#/components/parameters/X-Request-Deadline-At}, {$ref: components-v1.yaml#/components/parameters/Idempotency-Key}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: components-v1.yaml#/components/schemas/ChunkBatchRequest}}}}
      responses: {'200': {description: Maximum 2 MiB chunk result, headers: {Cache-Control: {schema: {const: no-store}}, X-Request-Id: {$ref: components-v1.yaml#/components/headers/X-Request-Id}}, content: {application/json: {schema: {$ref: components-v1.yaml#/components/schemas/ChunkBatchResult}}}}, '400': {$ref: '#/components/responses/Problem'}, '401': {$ref: '#/components/responses/Problem'}, '403': {$ref: '#/components/responses/Problem'}, '409': {$ref: '#/components/responses/Problem'}, '413': {$ref: '#/components/responses/Problem'}, '422': {$ref: '#/components/responses/Problem'}, '429': {$ref: '#/components/responses/ProblemRetry'}, '500': {$ref: '#/components/responses/Problem'}, '503': {$ref: '#/components/responses/ProblemRetry'}, '504': {$ref: '#/components/responses/Problem'}}
components:
  securitySchemes: {BearerAuth: {$ref: components-v1.yaml#/components/securitySchemes/BearerAuth}}
  responses:
    Problem: {description: Safe problem, headers: {Cache-Control: {schema: {const: no-store}}, X-Request-Id: {$ref: components-v1.yaml#/components/headers/X-Request-Id}}, content: {application/problem+json: {schema: {$ref: components-v1.yaml#/components/schemas/Problem}}}}
    ProblemRetry: {description: Safe transient problem, headers: {Cache-Control: {schema: {const: no-store}}, X-Request-Id: {$ref: components-v1.yaml#/components/headers/X-Request-Id}, Retry-After: {$ref: components-v1.yaml#/components/headers/Retry-After}}, content: {application/problem+json: {schema: {$ref: components-v1.yaml#/components/schemas/Problem}}}}
