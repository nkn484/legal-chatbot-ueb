    component: DocumentVersionProcessingRequested
    kind: COMMAND
    producer: document-service
    consumers:
    - processing-service
    aggregate_type: Version
    ordering_key_field: aggregate_id
    activation: CORE
    routable: true
    retry_class: transient_idempotent
    main_retention_days: 7
    dlq_retention_days: 14
    idempotency: (consumer_service,message_id)
    ordering_fencing: aggregate_revision
    aggregate_id_field: version_id
    aggregate_revision_field: version_revision
