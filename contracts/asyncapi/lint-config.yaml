version: 1
schema_version: 1.0.0
idempotency: (consumer_service,message_id)
ordering_fencing: aggregate_revision
main_retention_days: 7
dlq_retention_days: 14
deny_property_tokens:
- secret
- password
- credential
- api_key
- token
- authorization
- cookie
- storage_key
- object_key
- bucket
- presign
- signed_url
- url
- body
- content_text
- full_text
- prompt
- question
- excerpt
- feedback_comment
- raw_payload
- model_output
- current_state
- full_snapshot
safe_property_exceptions:
- content_hash
- payload_hash
- detail_hash
audit_allowed_producers:
- identity-service
- document-service
- processing-service
- index-service
- retrieval-service
- citation-service
- chat-service
- feedback-service
- evaluation-service
- provider-service
messages:
