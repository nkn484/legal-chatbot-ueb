components:
  messages:
    DocumentVersionProcessingRequested:
      name: DocumentVersionProcessingRequested
      contentType: application/json
      payload:
        $ref: ./schemas/core-messages.schema.json#/$defs/processingRequested
      bindings:
        amqp:
          bindingVersion: 0.3.0
      x-ueb-activation: CORE
      x-ueb-routable: true
      x-ueb-example: examples/valid/document-version-processing-requested.json
      x-ueb-acl:
        publish:
        - document-service
        consume:
        - processing-service
    ProcessingJobSucceeded:
