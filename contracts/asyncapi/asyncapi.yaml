asyncapi: 3.0.0
info:
  title: Legal chatbot event contract catalog
  version: 1.0.0
  description: Custom envelope v1 over AMQP 0-9-1; it does not claim CloudEvents AMQP
    compliance.
defaultContentType: application/json
