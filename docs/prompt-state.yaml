schema_version: 1
document_role: coordination_registry
runtime_authority: false
authority_hierarchy:
  executable_behavior: scripts/prompt_gate.py
  static_prompt_dependency_configuration: prompts/manifest.json
  sole_authoritative_mutable_runtime_state: .agent-run/prompt-state.json
  coordination_document: docs/prompt-state.yaml
  rule_explanation: docs/prompt-transition-rules.md
  decision_record: docs/decision-log.md
  limitation: Documentation cannot transition a prompt or authorize a successor.
layer_definitions:
  runtime_state:
    authority: .agent-run/prompt-state.json
    persisted_literals: [NOT_STARTED, IN_PROGRESS, AWAITING_APPROVAL, PASS, FAIL, DEFERRED]
  documentation_outcome:
    candidate_literals: [PASS_CANDIDATE, PASS_WITH_CONDITIONS_CANDIDATE, BLOCKED, FAIL]
    non_runtime_literals: [PASS_WITH_CONDITIONS, BLOCKED]
  registry:
    authority: false
    purpose: Mirrors manifest configuration and records coordination requirements; it is stale after its observation.
layer_mappings:
  PASS_CANDIDATE: Runtime becomes PASS only after submit and procedural human approval.
  PASS_WITH_CONDITIONS_CANDIDATE: Runtime becomes PASS only after procedural human approval with explicit conditions in the approval note and a linked decision log entry.
  BLOCKED: A documentation outcome only; it does not change runtime state.
  FAIL: Human rejection from AWAITING_APPROVAL persists runtime FAIL.
common_gate_semantics:
  dependency_eligibility: Every dependency must have status PASS or DEFERRED and a truthy human_approved_at.
  start: start accepts eligible NOT_STARTED, BLOCKED, or IN_PROGRESS and persists IN_PROGRESS unless already IN_PROGRESS.
  submit: submit requires IN_PROGRESS, an existing in-repository report, at least one existing evidence path, and the five required report markers; it persists AWAITING_APPROVAL.
  submission_channels: "required_report is separate from required_evidence: runtime receives them through --report and --evidence respectively. Runtime does not enforce that --report equals the manifest required_report; registry evidence is a governance expectation."
  human_approval: approve requires AWAITING_APPROVAL plus non-empty --by and --note and persists PASS.
  successor_eligibility: A successor is eligible only through the dependency rule; documents do not unlock it.
evidence_quality_warning: The gate checks only path existence and five report markers. It does not validate evidence quality, relevance, hashes, required_report binding, or actual test success; Orchestrator and human governance must verify those matters.
observed_runtime_snapshot:
  non_authoritative: true
  observed_for_prompt: "01.3"
  observed_on: 2026-08-13
  summary_counts: {PASS: 2, IN_PROGRESS: 1, NOT_STARTED: 69}
  statuses:
    "01.1": PASS
    "01.2": PASS
    "01.3": IN_PROGRESS
    all_remaining_manifest_prompt_ids: NOT_STARTED
  stale_after_observation: true
profiles:
  group_01: &group_01 {preferred_agents: [explorer, oracle], write_roots: ["docs/", ".agent-run/"]}
  group_02: &group_02 {preferred_agents: [oracle, librarian, council], write_roots: ["docs/architecture/", "contracts/", "docs/progress/"]}
  group_03: &group_03 {preferred_agents: [explorer, fixer, oracle], write_roots: ["services/", "packages/", "infra/", "deploy/", ".github/", "docs/", "tests/", Makefile]}
  group_04: &group_04 {preferred_agents: [explorer, librarian, fixer, oracle], write_roots: ["services/document-service/", "services/processing-service/", "services/index-service/", "packages/contracts/", "infra/", "tests/", "docs/"]}
  group_05: &group_05 {preferred_agents: [explorer, librarian, fixer, oracle, council], write_roots: ["services/retrieval-service/", "services/provider-service/", "services/citation-service/", "services/chat-service/", "packages/contracts/", "tests/", "docs/"]}
  group_06: &group_06 {preferred_agents: [explorer, librarian, fixer, oracle, council], write_roots: ["services/feedback-service/", "services/evaluation-service/", "packages/contracts/", "datasets/", "tests/", "docs/"]}
  group_07: &group_07 {preferred_agents: [explorer, designer, fixer, oracle, observer], write_roots: ["apps/web-chat/", "apps/admin-portal/", "infra/", "deploy/", "tests/", "docs/"]}
  group_08: &group_08 {preferred_agents: [explorer, fixer, oracle, council, observer], write_roots: ["tests/", "deploy/", "docs/", ".github/", "release/"]}
gate_defaults: &gate_defaults
  dependency: all dependencies are human-approved PASS or DEFERRED
  submit: IN_PROGRESS; existing in-repository report; >=1 existing evidence; markers Trạng thái, Đã thay đổi, Bằng chứng, Sai lệch, Đề xuất prompt tiếp theo
  human_approval: AWAITING_APPROVAL plus non-empty --by and --note; procedural only
  successor_eligibility: dependency rule must be satisfied in authoritative runtime state
open_condition_refs: &open_condition_refs [DEC-005]
